name: Frontend CI/CD (dev)

on:
  pull_request:
    branches:
      - develop-ci-cd
  push:
    branches:
      - develop-ci-cd

permissions:
  contents: read

jobs:
  validate:
    name: Validate source and Docker artifact
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify synchronization with develop
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/develop:refs/remotes/origin/develop"
          git merge-base --is-ancestor origin/develop HEAD

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://dev-api.lazyops.cloud
        run: npm run build

      - name: Build runtime image
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_API_URL=https://dev-api.lazyops.cloud
          --target runtime
          --tag dprental-frontend-ci:${{ github.sha }}
          .

  publish:
    name: Publish immutable image to GHCR
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop-ci-cd'
    runs-on: ubuntu-24.04
    environment: dev
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate GHCR namespace
        id: image-name
        env:
          IMAGE_NAMESPACE: ${{ vars.GHCR_IMAGE_NAMESPACE }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IMAGE_NAMESPACE"
          case "$IMAGE_NAMESPACE" in
            *[!a-z0-9._-]* | *[A-Z]*)
              echo 'GHCR_IMAGE_NAMESPACE must be lowercase and contain only a-z, 0-9, dot, underscore, or hyphen.' >&2
              exit 1
              ;;
          esac
          printf 'namespace=%s\n' "$IMAGE_NAMESPACE" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Frontend runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://dev-api.lazyops.cloud
          tags: ghcr.io/${{ steps.image-name.outputs.namespace }}/dprental-frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy-dev:
    name: Deploy Frontend to dev VPS
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop-ci-cd'
    runs-on: ubuntu-24.04
    environment: dev
    concurrency:
      group: dprental-dev
      cancel-in-progress: false

    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v4

      - name: Configure SSH trust
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEV_VPS_SSH_PRIVATE_KEY }}
          DEPLOY_VPS_KNOWN_HOSTS: ${{ secrets.DEV_VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_VPS_KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          chmod 0644 "$HOME/.ssh/known_hosts"

      - name: Synchronize deployment script
        env:
          DEPLOY_VPS_HOST: ${{ secrets.DEV_VPS_HOST }}
          DEPLOY_VPS_USER: ${{ secrets.DEV_VPS_USER }}
          DEPLOY_VPS_PORT: ${{ secrets.DEV_VPS_PORT || '22' }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_VPS_HOST"
          test -n "$DEPLOY_VPS_USER"
          remote_temporary_script="/tmp/deploy-frontend-${RELEASE_SHA}.sh"
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_VPS_PORT" \
            "$DEPLOY_VPS_USER@$DEPLOY_VPS_HOST" \
            'install -d -m 0750 /opt/dprental/dev/scripts'
          scp \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -P "$DEPLOY_VPS_PORT" \
            scripts/deploy-frontend.sh \
            "$DEPLOY_VPS_USER@$DEPLOY_VPS_HOST:$remote_temporary_script"
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_VPS_PORT" \
            "$DEPLOY_VPS_USER@$DEPLOY_VPS_HOST" \
            "install -m 0750 '$remote_temporary_script' /opt/dprental/dev/scripts/deploy-frontend.sh && rm -f '$remote_temporary_script'"

      - name: Deploy the published revision
        env:
          DEPLOY_VPS_HOST: ${{ secrets.DEV_VPS_HOST }}
          DEPLOY_VPS_USER: ${{ secrets.DEV_VPS_USER }}
          DEPLOY_VPS_PORT: ${{ secrets.DEV_VPS_PORT || '22' }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_VPS_HOST"
          test -n "$DEPLOY_VPS_USER"
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_VPS_PORT" \
            "$DEPLOY_VPS_USER@$DEPLOY_VPS_HOST" \
            /opt/dprental/dev/scripts/deploy-frontend.sh "$RELEASE_SHA"
