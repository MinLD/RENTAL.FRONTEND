name: Frontend CI/CD (dev)

on:
  pull_request:
    branches:
      - develop-ci-cd
  push:
    branches:
      - develop-ci-cd

permissions:
  contents: read

env:
  NEXT_PUBLIC_API_URL: https://dev-api.lazyops.cloud
  IMAGE_REPOSITORY: ghcr.io/huutawn/dprental-frontend

jobs:
  validate:
    name: Validate frontend
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify synchronization with develop
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/develop:refs/remotes/origin/develop"
          git merge-base --is-ancestor origin/develop HEAD

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  publish:
    name: Publish Frontend image
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop-ci-cd'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Frontend image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend-dev
          cache-to: type=gha,scope=frontend-dev,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy-dev:
    name: Deploy Frontend to dev VPS
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop-ci-cd'
    runs-on: ubuntu-24.04
    environment: dev
    concurrency:
      group: dprental-dev
      cancel-in-progress: false
    steps:
      - name: Checkout deployment script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure SSH trust
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEV_VPS_SSH_PRIVATE_KEY }}
          DEPLOY_VPS_KNOWN_HOSTS: ${{ secrets.DEV_VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_VPS_KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          chmod 0644 "$HOME/.ssh/known_hosts"

      - name: Deploy published image by digest
        env:
          DEPLOY_VPS_HOST: ${{ secrets.DEV_VPS_HOST }}
          DEPLOY_VPS_USER: ${{ secrets.DEV_VPS_USER }}
          DEPLOY_VPS_PORT: ${{ secrets.DEV_VPS_PORT || '22' }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_VPS_HOST"
          test -n "$DEPLOY_VPS_USER"
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_VPS_PORT" \
            "$DEPLOY_VPS_USER@$DEPLOY_VPS_HOST" \
            "bash -s -- '$image'" < scripts/deploy-frontend.sh
