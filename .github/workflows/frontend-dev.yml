name: Frontend CI/CD (dev)

on:
  push:
    branches:
      - develop-ci-cd

permissions:
  contents: read

env:
  NEXT_PUBLIC_API_URL: https://dev-api.lazyops.cloud
  IMAGE_REPOSITORY: ghcr.io/huutawn/dprental-frontend

jobs:
  validate-deployment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate deployment scripts and boundaries
        run: |
          bash -n scripts/deploy-frontend.sh scripts/deploy-common.sh
          python3 -m unittest discover -s tests -p 'test_deploy*.py'

  publish:
    name: Publish Frontend image
    needs: validate-deployment
    runs-on: ubuntu-24.04
    environment: dev
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SIGNALR_HUB_URL=${{ vars.NEXT_PUBLIC_SIGNALR_HUB_URL }}
            PAYMENT_API_BASE_URL=${{ vars.PAYMENT_API_BASE_URL }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deployment-policy:
    needs: publish
    runs-on: ubuntu-24.04
    environment: dev
    permissions:
      contents: read
      packages: read
    outputs:
      private: ${{ steps.visibility.outputs.private }}
    steps:
      - name: Verify actual repository visibility
        id: visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api repos/huutawn/DPRENTAL.FRONTEND --jq '.private')" = true
          printf 'private=true\n' >> "$GITHUB_OUTPUT"
      - name: Login to GHCR with read permission
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published image is readable
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          timeout 60s docker manifest inspect "$IMAGE_REPOSITORY:$RELEASE_SHA" >/dev/null

  deploy-dev:
    name: Deploy Frontend locally on Ubuntu VM
    needs: [publish, deployment-policy]
    if: ${{ github.event_name == 'push' && github.repository == 'huutawn/DPRENTAL.FRONTEND' && github.ref == 'refs/heads/develop-ci-cd' && needs.deployment-policy.outputs.private == 'true' && vars.DEV_DEPLOY_ENABLED == 'true' }}
    runs-on: [self-hosted, linux, x64, dprental-frontend-deploy]
    environment: dev
    timeout-minutes: 30
    concurrency:
      group: dprental-dev
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy approved Frontend revision through root-managed entrypoint
        env:
          RELEASE_SHA: ${{ github.sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$GHCR_USERNAME"
          test -n "$GHCR_TOKEN"
          printf '%s\n' "$GHCR_USERNAME" "$GHCR_TOKEN" | sudo -n /usr/local/sbin/dprental-deploy frontend "$RELEASE_SHA"
